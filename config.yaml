# Non-secret dashboard configuration. Secrets live in .env.

timezone: America/Los_Angeles
location_label: Berkeley
footer_name: Bedroom board

# 1 = black/white BMP. 2 = 4-level grayscale PNG (TRMNL firmware 1.6.0+,
# experimental). The reTerminal E1001 on FW1.8.10 drew a blank screen for our
# 2-bit PNG (cf. trmnl-firmware#606), so 1-bit for now.
bit_depth: 1
# png (default) or bmp. The E1001 on FW1.8.10 accepted our 1-bit BMP but never
# drew it, so PNG.
device_format: png

# How often the server re-renders the screen (seconds). The device only
# downloads when the image actually changed.
render_every: 300

# Device wake schedule, local time. First matching window wins; "sleep"
# windows tell the device to sleep until the window ends.
refresh:
  - {from: "22:30", to: "06:30", sleep: true}
  - {from: "11:00", to: "19:00", seconds: 900}
  - {from: "00:00", to: "24:00", seconds: 1800}

weather_entity: weather.nws_home

# Bottom strip tiles (up to `house_slots`; unused slots stay blank).
house_slots: 4
# `temp`/`humidity` are entity ids; `note` is optional
# extra text; `extra` pulls another entity's state into the note.
house:
  - label: Bedroom
    temp: sensor.0xb0e8e8fffe9a36c2_temperature
    humidity: sensor.0xb0e8e8fffe9a36c2_humidity
    extra: {entity: input_select.bedroom_fan_speed, prefix: "Fan: "}
  - label: Office
    temp: sensor.0x70d07efffedee566_temperature
    humidity: sensor.0x70d07efffedee566_humidity


# HA to-do list that is the household attention hub (see HA scripts
# attention_add / attention_resolve and automation attention_sync). Open items
# are shown, highest priority first.
attention_list: todo.household

jewish_calendar:
  holiday: sensor.jewish_calendar_holiday
  date: sensor.jewish_calendar_date
  candle_lighting: sensor.jewish_calendar_upcoming_candle_lighting
  havdalah: sensor.jewish_calendar_upcoming_havdalah
  issur_melacha: binary_sensor.jewish_calendar_issur_melacha_in_effect

wind:
  # iWindsurf "San Francisco" pro forecast.
  forecast_id: 2
  hours: [13, 14, 15, 16, 17, 18]
  # Spot ids are shared by the pro forecast and the live station feed.
  spots:
    - {name: Berkeley, id: 409}       # Berkeley Marina - Olympic Circle
    - {name: Point Isabel, id: 161947}  # forecast: "Richmond Harbor - Albany Bulb"
    - {name: TI, id: 87071}           # Treasure Island
    - {name: Candlestick, id: 412}    # Candlestick Point
